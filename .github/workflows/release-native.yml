name: Release Native

on:
  # workflow_dispatch
  push:
    tags:
      - "v*"

env:
  PROJECT_NAME: TemplateProject

jobs:
  create_release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{steps.create_release.outputs.upload_url}}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        with:
          draft: true
          tag_name: ${{github.ref}}
          release_name: Release ${{github.ref}}
          body_path: ${{env.PROJECT_NAME}}/installer/changelog.txt

  build:
    name: Build
    needs: create_release
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [macos-latest, windows-2022]
        include:
          - os: macos-latest
            build_dir: build-mac
          - os: windows-2022
            build_dir: build-win

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install pandoc
      uses: pandoc/actions/setup@v1

    - name: Install typst
      uses: typst-community/setup-typst@v5

    - name: Get VST3 SDK
      run: |
        cd modules/iPlug2/Dependencies/IPlug
        ./download-iplug-sdks.sh
      shell: bash

    - name: Get Prebuilt Libs
      run: |
        cd modules/iPlug2/Dependencies
        ./download-prebuilt-libs.sh
      shell: bash

    - name: Get Archive Name macOS
      id: mac_archivename_step
      if: matrix.os == 'macOS-latest'
      run: |
        ARCHIVE_NAME=`python3 modules/iPlug2/Scripts/get_archive_name.py ${{env.PROJECT_NAME}} mac full`
        echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
      shell: bash

    - name: Build macOS
      if: matrix.os == 'macOS-latest'
      run: |
        cd ${{env.PROJECT_NAME}}/scripts
        ./makedist-mac.sh full installer
      shell: bash

    - name: Upload mac DSYMs release asset
      if: matrix.os == 'macOS-latest'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      with:
        upload_url: ${{needs.create_release.outputs.upload_url}}
        asset_path: ${{env.PROJECT_NAME}}/${{matrix.build_dir}}/out/${{steps.mac_archivename_step.outputs.archive_name}}-dSYMs.zip
        asset_name: ${{steps.mac_archivename_step.outputs.archive_name}}-dSYMs.zip
        asset_content_type: application/zip

    - name: Upload mac dmg release asset
      if: matrix.os == 'macOS-latest'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      with:
        upload_url: ${{needs.create_release.outputs.upload_url}}
        asset_path: ${{env.PROJECT_NAME}}/${{matrix.build_dir}}/out/${{steps.mac_archivename_step.outputs.archive_name}}.dmg
        asset_name: ${{steps.mac_archivename_step.outputs.archive_name}}.dmg
        asset_content_type: application/octet-stream

    - name: Add msbuild to PATH (Windows)
      if: matrix.os == 'windows-2022'
      uses: microsoft/setup-msbuild@v1

    - name: Setup Python3
      if: matrix.os == 'windows-2022'
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
        architecture: 'x64'

    - name: Get Archive Name Windows
      id: win_archivename_step
      if: matrix.os == 'windows-2022'
      run: |
        ARCHIVE_NAME=`python.exe modules/iPlug2/Scripts/get_archive_name.py ${{env.PROJECT_NAME}} win full`
        echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
      shell: bash

    - name: Build Windows
      if: matrix.os == 'windows-2022'
      run: |
        cd ${{env.PROJECT_NAME}}\scripts
        .\makedist-win.bat full installer
      shell: pwsh

    - name: Upload Windows pdb release asset
      if: matrix.os == 'windows-2022'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      with:
        upload_url: ${{needs.create_release.outputs.upload_url}}
        asset_path: ${{env.PROJECT_NAME}}/${{matrix.build_dir}}/out/${{steps.win_archivename_step.outputs.archive_name}}-pdbs.zip
        asset_name: ${{steps.win_archivename_step.outputs.archive_name}}-pdbs.zip
        asset_content_type: application/zip

    - name: Upload Windows zip release asset
      if: matrix.os == 'windows-2022'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      with:
        upload_url: ${{needs.create_release.outputs.upload_url}}
        asset_path: ${{env.PROJECT_NAME}}/${{matrix.build_dir}}/out/${{steps.win_archivename_step.outputs.archive_name}}.zip
        asset_name: ${{steps.win_archivename_step.outputs.archive_name}}.zip
        asset_content_type: application/zip

  build-linux:
    name: Build Linux
    needs: create_release
    # Build on the oldest supported Ubuntu so the binaries run on older glibc
    runs-on: ubuntu-22.04

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ninja-build \
          pkg-config \
          libgdk-pixbuf-2.0-dev \
          libglib2.0-dev \
          libgtk-3-dev \
          libfreetype-dev \
          libfontconfig-dev \
          libasound2-dev \
          libjack-jackd2-dev \
          libpulse-dev \
          libgl-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxcb1-dev \
          libxi-dev \
          libxext-dev \
          libxrender-dev \
          libxrandr-dev \
          libxfixes-dev \
          libxcursor-dev

    - name: Get SDKs
      run: |
        cd modules/iPlug2/Dependencies/IPlug
        ./download-iplug-sdks.sh

    - name: Get Archive Name Linux
      id: linux_archivename_step
      run: |
        ARCHIVE_NAME=`python3 modules/iPlug2/Scripts/get_archive_name.py ${{env.PROJECT_NAME}} linux-$(uname -m) full`
        echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT

    - name: Build Linux
      run: |
        cd ${{env.PROJECT_NAME}}/scripts
        ./makedist-linux.sh full

    - name: Upload Linux tar.gz release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      with:
        upload_url: ${{needs.create_release.outputs.upload_url}}
        asset_path: ${{env.PROJECT_NAME}}/build-linux/out/${{steps.linux_archivename_step.outputs.archive_name}}.tar.gz
        asset_name: ${{steps.linux_archivename_step.outputs.archive_name}}.tar.gz
        asset_content_type: application/gzip
